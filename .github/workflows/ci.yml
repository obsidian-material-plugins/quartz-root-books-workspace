name: CI

on:
  push:
    branches: ["main"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify dist is up to date
        run: |
          if git diff --quiet dist/; then
            echo "dist/ is up to date"
          else
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi

      - name: Verify dist externals
        run: npm run verify:dist

      - name: Verify packed package
        run: npm run verify:package

      # The same commit already runs these expensive host-level checks when pushed to main.
      # Release tags skip them and instead verify below that the tagged commit is contained in main.
      - name: Prepare configured Quartz integration host
        if: github.ref_type != 'tag'
        id: configured_host
        run: |
          host="$RUNNER_TEMP/quartz-for-gitlab"
          git clone --depth 1 https://gitlab.utu.fi/obsidian/quartz-for-gitlab.git "$host"
          npm ci --prefix "$host"
          npm install --prefix "$host" --no-save @quartz-community/folder-page@0.1.0
          echo "lock_hash=$(sha256sum "$host/quartz.lock.json" "$host/package-lock.json" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "RIP_QUARTZ_ROOT=$host" >> "$GITHUB_ENV"
          echo "Configured Quartz host revision: $(git -C "$host" rev-parse HEAD)"

      - name: Cache configured Quartz plugin checkouts
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quartz-for-gitlab/.quartz/plugins
          key: configured-quartz-plugins-${{ runner.os }}-${{ steps.configured_host.outputs.lock_hash }}

      - name: Install configured Quartz plugins
        if: github.ref_type != 'tag'
        run: |
          host="$RUNNER_TEMP/quartz-for-gitlab"
          (
            cd "$host"
            npx quartz plugin install --from-config
          )

      - name: Run configured Quartz integration
        if: github.ref_type != 'tag'
        run: npm run test:integration

      - name: Run watch-mode integration
        if: github.ref_type != 'tag'
        run: npm run test:watch-integration

      - name: Verify npm pack dry run
        run: npm pack --dry-run

      - name: Check whitespace errors
        run: git diff --check

  # npm authenticates this job through GitHub OIDC Trusted Publishing; no npm token is required.
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit is contained in main
        shell: bash
        run: |
          release_commit="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag $GITHUB_REF_NAME points to $release_commit, which is not contained in main"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="$GITHUB_REF_NAME"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published; skipping npm publish"
          else
            npm publish --access public
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
